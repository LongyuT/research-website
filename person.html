<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Montgomery Group - Person</title>
  <meta name="description" content="Montgomery Group — Person profile." />

  <link rel="icon" type="image/x-icon" href="https://www.owlstown.com/favicon.ico" />
  <link rel="stylesheet" href="assets/css/style.css" />

  <style>
    .back-link{
      display:inline-block;
      margin: 8px 0 18px;
      color: var(--link);
      text-decoration: underline;
      font-weight: 600;
    }
    .profile{
      display:grid;
      grid-template-columns: 260px 1fr;
      gap: 28px;
      align-items:start;
    }
    @media (max-width: 820px){
      .profile{ grid-template-columns: 1fr; }
    }
    .profile-photo{
      width:100%;
      background:#f1f1f1;
      box-shadow: 0 12px 28px rgba(0,0,0,.10);
    }
    .profile-photo img{
      width:100%;
      display:block;
      object-fit: cover;
    }
    .profile-name{
      margin:0;
      font-size: 34px;
      font-weight: 900;
      line-height: 1.15;
    }
    .profile-role{
      margin: 10px 0 16px;
      color: var(--muted);
      font-weight: 700;
    }
    .pill-row{
      display:flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 12px 0 18px;
    }
    .pill{
      display:inline-block;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      text-decoration:none;
      color: var(--text);
      background:#fff;
      font-size: 13px;
      font-weight: 700;
    }
    .pill:hover{ background:#fafafa; }
    .bio{
      margin: 0;
      white-space: pre-line;
    }
    .error-box{
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff7f7;
      color: #8a1f1f;
    }
  </style>
</head>

<body>

  <header class="hero">
    <div class="hero-bg" style="background-image:url('assets/img/banner.jpg');"></div>
    <div class="hero-overlay"></div>

    <div class="hero-inner">
      <nav class="nav">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="publications.html">Publications</a>
        <a class="nav-link active" href="people.html">People</a>
        <a class="nav-link" href="projects.html">Projects</a>
        <a class="nav-link" href="resources.html">Resources</a>
        <a class="nav-link" href="highlights.html">Highlights</a>
      </nav>

      <div class="hero-title-row">
        <div class="hero-avatar">
          <img src="assets/img/avatar.jpg" alt="Group avatar" />
        </div>
        <div class="hero-title">
          <h1>Montgomery Group</h1>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="section">
      <a class="back-link" href="people.html">← Back to People</a>

      <div id="personError" class="error-box" style="display:none;"></div>

      <div id="personWrap" style="display:none;">
        <div class="profile">
          <div class="profile-photo">
            <img id="personPhoto" src="" alt="" />
          </div>

          <div>
            <h2 id="personName" class="profile-name"></h2>
            <div id="personRole" class="profile-role"></div>

            <div id="personLinks" class="pill-row"></div>

            <div class="divider"></div>
            <h3 class="section-title" style="font-size: 26px;">Bio</h3>
            <div class="divider"></div>
            <p id="personBio" class="bio"></p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-row">
        <div class="footer-copy">&copy; 2026 Montgomery Group</div>
        <div class="footer-links">
          <a href="privacy.html">Privacy Policy</a>
        </div>
      </div>
    </div>
  </footer>

  <script>
    function safeText(s){ return (s ?? "").toString(); }

    function showError(msg){
      const box = document.getElementById('personError');
      box.style.display = 'block';
      box.textContent = msg;
    }

    function pill(label, href){
      if(!href) return null;
      const a = document.createElement('a');
      a.className = 'pill';
      a.href = href;
      a.textContent = label;
      if(/^https?:\/\//i.test(href)){
        a.target = '_blank';
        a.rel = 'noopener';
      }
      return a;
    }

    async function loadPerson(){
      const params = new URLSearchParams(location.search);
      const id = (params.get('id') || '').trim();
      if(!id){
        showError("Person not found (missing id). Use person.html?id=xxx");
        return;
      }

      try{
        const res = await fetch('assets/data/people.json', { cache: 'no-store' });
        if(!res.ok) throw new Error("people.json 读取失败：" + res.status);

        const people = await res.json();
        const person = Array.isArray(people) ? people.find(p => safeText(p.id).trim() === id) : null;
        if(!person){
          showError("Person not found: " + id);
          return;
        }

        const name = safeText(person.name) || 'Unnamed';
        const role = safeText(person.role) || '';
        const photo = safeText(person.photo) || 'assets/img/people/placeholder.png';
        const bio = safeText(person.bio || person.short_bio || '') || "—";

        document.title = `Montgomery Group - ${name}`;

        document.getElementById('personName').textContent = name;
        document.getElementById('personRole').textContent = role;

        const img = document.getElementById('personPhoto');
        img.src = photo;
        img.alt = name;

        document.getElementById('personBio').textContent = bio;

        // links
        const linksWrap = document.getElementById('personLinks');
        linksWrap.innerHTML = "";

        const email = safeText(person.email).trim();
        if(email){
          const a = pill("Email", "mailto:" + email);
          if(a) linksWrap.appendChild(a);
        }

        const links = person.links || {};
        ["Website","Google Scholar","ORCID","CV"].forEach(()=>{});

        const a1 = pill("Website", links.website);
        const a2 = pill("Google Scholar", links.scholar);
        const a3 = pill("ORCID", links.orcid);
        const a4 = pill("CV", links.cv);

        [a1,a2,a3,a4].forEach(x => { if(x) linksWrap.appendChild(x); });

        document.getElementById('personWrap').style.display = 'block';

      }catch(e){
        showError("加载 Person 页面失败： " + e.message);
      }
    }

    loadPerson();
  </script>

</body>
</html>
