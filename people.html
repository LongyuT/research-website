<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Montgomery Group - People</title>
  <meta name="description" content="Montgomery Group — People." />

  <link rel="icon" type="image/x-icon" href="https://www.owlstown.com/favicon.ico" />
  <link rel="stylesheet" href="assets/css/style.css" />

  <style>
    /* People grid (不破坏你原来的 style.css，只做补充) */
    .people-grid{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }
    @media (max-width: 900px){
      .people-grid{ grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 520px){
      .people-grid{ grid-template-columns: 1fr; }
    }

    .person-card{
      display:block;
      text-decoration:none;
      color: inherit;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow:hidden;
      background:#fff;
      box-shadow: 0 10px 25px rgba(0,0,0,.06);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .person-card:hover{
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(0,0,0,.10);
    }

    .person-photo{
      width:100%;
      aspect-ratio: 4 / 3;
      background:#f1f1f1;
      overflow:hidden;
    }
    .person-photo img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
    }

    .person-body{
      padding: 14px 14px 16px;
    }

    .person-name{
      margin: 0 0 4px;
      font-size: 18px;
      font-weight: 800;
      color: var(--link);
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 2px;
    }
    .person-role{
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }
    .person-bio{
      margin: 0;
      font-size: 13px;
      color: var(--text);
      line-height: 1.55;
    }
    .error-box{
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff7f7;
      color: #8a1f1f;
    }
  </style>
</head>

<body>

  <!-- Header / Hero -->
  <header class="hero">
    <div class="hero-bg" style="background-image:url('assets/img/banner.jpg');"></div>
    <div class="hero-overlay"></div>

    <div class="hero-inner">
      <nav class="nav">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="publications.html">Publications</a>
        <a class="nav-link active" href="people.html">People</a>
        <a class="nav-link" href="projects.html">Projects</a>
        <a class="nav-link" href="highlights.html">Highlights</a>
      </nav>

      <div class="hero-title-row">
        <div class="hero-avatar">
          <img src="assets/img/avatar.jpg" alt="Group avatar" />
        </div>
        <div class="hero-title">
          <h1>Montgomery Group</h1>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="section">
      <h2 class="section-title">People</h2>
      <div class="divider"></div>

      <div id="peopleError" class="error-box" style="display:none;"></div>
      <div id="peopleGrid" class="people-grid"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-row">
        <div class="footer-copy">&copy; 2026 Montgomery Group</div>
        <div class="footer-links">
          <a href="privacy.html">Privacy Policy</a>
        </div>
      </div>
    </div>
  </footer>

  <script>
    function safeText(s){
      return (s ?? "").toString();
    }

    function truncate(s, n){
      s = safeText(s).trim();
      if (!s) return "";
      return s.length > n ? s.slice(0, n - 1) + "…" : s;
    }

    function showError(msg){
      const box = document.getElementById('peopleError');
      box.style.display = 'block';
      box.textContent = msg;
    }

    async function loadPeople(){
      const grid = document.getElementById('peopleGrid');
      grid.innerHTML = "";

      try{
        const res = await fetch('assets/data/people.json', { cache: 'no-store' });
        if(!res.ok) throw new Error("people.json 读取失败：" + res.status);
        const people = await res.json();

        if(!Array.isArray(people) || people.length === 0){
          showError("没有找到人员数据（assets/data/people.json 为空或格式不对）。");
          return;
        }

        for(const p of people){
          const id = safeText(p.id).trim();
          if(!id) continue;

          const a = document.createElement('a');
          a.className = 'person-card';
          a.href = 'person.html?id=' + encodeURIComponent(id);

          const photoUrl = safeText(p.photo) || 'assets/img/avatar.jpg';
          const name = safeText(p.name) || 'Unnamed';
          const role = safeText(p.role) || '';
          const bio = truncate(p.short_bio || p.bio || '', 210);

          a.innerHTML = `
            <div class="person-photo">
              <img src="${photoUrl}" alt="${name}" loading="lazy" />
            </div>
            <div class="person-body">
              <div class="person-name">${name}</div>
              ${role ? `<div class="person-role">${role}</div>` : ``}
              ${bio ? `<p class="person-bio">${bio}</p>` : ``}
            </div>
          `;

          grid.appendChild(a);
        }

      }catch(e){
        showError("加载 People 页面失败： " + e.message);
      }
    }

    loadPeople();
  </script>

</body>
</html>
