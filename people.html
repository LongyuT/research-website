<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Montgomery Group - People</title>
  <meta name="description" content="Montgomery Group — People." />

  <link rel="icon" type="image/x-icon" href="https://www.owlstown.com/favicon.ico" />
  <link rel="stylesheet" href="assets/css/style.css" />

  <style>
    .person-card{
      text-decoration: none;
      color: inherit;
    }

    .person-name{
      color: var(--link);
    }

    .people-subtitle{
      font-size: 28px;
      font-weight: 800;
      margin: 28px 0 14px;
      color: var(--text);
    }

    .people-section{
      margin-bottom: 34px;
    }

    .person-photo{
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      overflow: hidden;
      background: #f2f2f2;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .person-photo img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .no-photo{
      width: 100%;
      height: 100%;
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      font-weight: 700;
      font-size: 18px;
      background: #f3f4f6;
    }

    .error-box{
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff7f7;
      color: #8a1f1f;
      margin-bottom: 14px;
    }
  </style>
</head>

<body>

  <header class="hero">
    <div class="hero-bg" style="background-image:url('assets/img/banner.jpg');"></div>
    <div class="hero-overlay"></div>

    <div class="hero-inner">
      <nav class="nav">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="publications.html">Publications</a>
        <a class="nav-link active" href="people.html">People</a>
        <a class="nav-link" href="projects.html">Projects</a>
        <a class="nav-link" href="resources.html">Resources</a>
        <a class="nav-link" href="highlights.html">Highlights</a>
      </nav>

      <div class="hero-title-row">
        <div class="hero-avatar">
          <img src="assets/img/avatar.jpg" alt="Group avatar" />
        </div>
        <div class="hero-title">
          <h1>Montgomery Group</h1>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="section">
      <h2 class="section-title">People</h2>
      <div class="divider"></div>

      <div id="peopleError" class="error-box" style="display:none;"></div>

      <div class="people-section">
        <h3 class="people-subtitle">Principal Investigator</h3>
        <div id="piGrid" class="people-grid"></div>
      </div>

      <div class="people-section">
        <h3 class="people-subtitle">Graduate Students</h3>
        <div id="graduateGrid" class="people-grid"></div>
      </div>

      <div class="people-section">
        <h3 class="people-subtitle">Undergraduate Researchers</h3>
        <div id="undergraduateGrid" class="people-grid"></div>
      </div>

      <div class="people-section">
        <h3 class="people-subtitle">Former Group Members</h3>
        <div id="formerPeopleGrid" class="people-grid"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-row">
        <div class="footer-copy">&copy; 2026 Montgomery Group</div>
        <div class="footer-links">
          <a href="privacy.html">Privacy Policy</a>
        </div>
      </div>
    </div>
  </footer>

  <script>
    function safeText(s){
      return (s ?? "").toString();
    }

    function truncate(s, n){
      s = safeText(s).trim();
      if (!s) return "";
      return s.length > n ? s.slice(0, n - 1) + "…" : s;
    }

    function showError(msg){
      const box = document.getElementById('peopleError');
      box.style.display = 'block';
      box.textContent = msg;
    }

    function createCard(p){
      const id = safeText(p.id).trim();
      if(!id) return null;

      const name = safeText(p.name) || "Unnamed";
      const role = safeText(p.role) || "";
      const photoUrl = safeText(p.photo).trim();
      const bio = truncate(p.short_bio || p.bio || "", 260);

      const card = document.createElement('a');
      card.className = 'person-card';
      card.href = 'person.html?id=' + encodeURIComponent(id);

      const photoHtml = photoUrl
        ? `<div class="person-photo">
             <img src="${photoUrl}" alt="${name}" loading="lazy" />
           </div>`
        : `<div class="person-photo">
             <div class="no-photo">No Photo</div>
           </div>`;

      card.innerHTML = `
        ${photoHtml}
        <div>
          <div class="person-name">${name}</div>
          ${role ? `<div class="person-role">${role}</div>` : ``}
          ${bio ? `<p class="person-bio">${bio}</p>` : ``}
        </div>
      `;

      return card;
    }

    async function loadPeople(){
      const piGrid = document.getElementById('piGrid');
      const graduateGrid = document.getElementById('graduateGrid');
      const undergraduateGrid = document.getElementById('undergraduateGrid');
      const formerGrid = document.getElementById('formerPeopleGrid');

      piGrid.innerHTML = "";
      graduateGrid.innerHTML = "";
      undergraduateGrid.innerHTML = "";
      formerGrid.innerHTML = "";

      try{
        const res = await fetch('assets/data/people.json', { cache: 'no-store' });
        if(!res.ok) throw new Error("people.json read failed: " + res.status);

        const people = await res.json();
        if(!Array.isArray(people) || people.length === 0){
          showError("No personnel data found. assets/data/people.json is empty or incorrectly formatted.");
          return;
        }

        const piPeople = people.filter(p => safeText(p.role).trim() === "Principal Investigator");
        const graduatePeople = people.filter(p => safeText(p.role).trim() === "Graduate Student");
        const undergraduatePeople = people.filter(p => safeText(p.role).trim() === "Undergraduate Researcher");
        const formerPeople = people.filter(p => safeText(p.role).trim() === "Former Group Member");

        for(const p of piPeople){
          const card = createCard(p);
          if(card) piGrid.appendChild(card);
        }

        for(const p of graduatePeople){
          const card = createCard(p);
          if(card) graduateGrid.appendChild(card);
        }

        for(const p of undergraduatePeople){
          const card = createCard(p);
          if(card) undergraduateGrid.appendChild(card);
        }

        for(const p of formerPeople){
          const card = createCard(p);
          if(card) formerGrid.appendChild(card);
        }

      }catch(e){
        showError("Failed to load the People page: " + e.message);
      }
    }

    loadPeople();
  </script>

</body>
</html>
