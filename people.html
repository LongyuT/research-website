<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Montgomery Group - People</title>
  <meta name="description" content="Montgomery Group — People." />

  <link rel="icon" type="image/x-icon" href="https://www.owlstown.com/favicon.ico" />
  <link rel="stylesheet" href="assets/css/style.css" />

  <style>
    .person-card{
      text-decoration: none;
      color: inherit;
    }
    .person-name{
      color: var(--link);
    }
  </style>
</head>

<body>

  <!-- Header / Hero -->
  <header class="hero">
    <div class="hero-bg" style="background-image:url('assets/img/banner.jpg');"></div>
    <div class="hero-overlay"></div>

    <div class="hero-inner">
      <nav class="nav">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="publications.html">Publications</a>
        <a class="nav-link active" href="people.html">People</a>
        <a class="nav-link" href="projects.html">Projects</a>
        <a class="nav-link" href="resources.html">Resources</a>
        <a class="nav-link" href="highlights.html">Highlights</a>
      </nav>

      <div class="hero-title-row">
        <div class="hero-avatar">
          <img src="assets/img/avatar.jpg" alt="Group avatar" />
        </div>
        <div class="hero-title">
          <h1>Montgomery Group</h1>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="section">
      <h2 class="section-title">People</h2>
      <div class="divider"></div>

      <div id="peopleError" class="error-box" style="display:none;"></div>
      <div id="peopleGrid" class="people-grid"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-row">
        <div class="footer-copy">&copy; 2026 Montgomery Group</div>
        <div class="footer-links">
          <a href="privacy.html">Privacy Policy</a>
        </div>
      </div>
    </div>
  </footer>

  <script>
    function safeText(s){ return (s ?? "").toString(); }

    function truncate(s, n){
      s = safeText(s).trim();
      if (!s) return "";
      return s.length > n ? s.slice(0, n - 1) + "…" : s;
    }

    function showError(msg){
      const box = document.getElementById('peopleError');
      box.style.display = 'block';
      box.textContent = msg;
    }

    async function loadPeople(){
      const grid = document.getElementById('peopleGrid');
      grid.innerHTML = "";

      try{
        const res = await fetch('assets/data/people.json', { cache: 'no-store' });
        if(!res.ok) throw new Error("people.json 读取失败：" + res.status);

        const people = await res.json();
        if(!Array.isArray(people) || people.length === 0){
          showError("No personnel data found（assets/data/people.json is empty or incorrect format）。");
          return;
        }

        for(const p of people){
          const id = safeText(p.id).trim();
          if(!id) continue;

          const name = safeText(p.name) || "Unnamed";
          const role = safeText(p.role) || "";
          const photoUrl = safeText(p.photo) || "assets/img/people/placeholder.png";
          const bio = truncate(p.short_bio || p.bio || "", 260);

          const card = document.createElement('a');
          card.className = 'person-card';
          card.href = 'person.html?id=' + encodeURIComponent(id);

          card.innerHTML = `
            <div class="person-photo">
              <img src="${photoUrl}" alt="${name}" loading="lazy" />
            </div>
            <div>
              <div class="person-name">${name}</div>
              ${role ? `<div class="person-role">${role}</div>` : ``}
              ${bio ? `<p class="person-bio">${bio}</p>` : ``}
            </div>
          `;

          grid.appendChild(card);
        }

      }catch(e){
        showError("Failed to load People page： " + e.message);
      }
    }

    loadPeople();
  </script>

  <style>
    .error-box{
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff7f7;
      color: #8a1f1f;
      margin-bottom: 14px;
    }
  </style>

</body>
</html>
