<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Resources | Montgomery Group</title>
  <meta name="description" content="Resources for the Montgomery Group." />

  <link rel="icon" type="image/x-icon" href="https://www.owlstown.com/favicon.ico" />
  <link rel="stylesheet" href="assets/css/style.css" />

  <style>
    .error-box{
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff7f7;
      color: #8a1f1f;
      margin-bottom: 14px;
    }

    .resources-list{
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 6px;
    }

    .resource-item{
      background: var(--panel-2);
      border-radius: 18px;
      padding: 18px 20px;
    }

    .resource-title{
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.4;
    }

    .resource-title a{
      color: var(--link);
      text-decoration: underline;
    }

    .resource-desc{
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.75;
    }
  </style>
</head>

<body>

  <header class="hero">
    <div class="hero-bg" style="background-image:url('assets/img/banner.jpg');"></div>
    <div class="hero-overlay"></div>

    <div class="hero-inner">
      <nav class="nav">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="publications.html">Publications</a>
        <a class="nav-link" href="people.html">People</a>
        <a class="nav-link" href="projects.html">Projects</a>
        <a class="nav-link active" href="resources.html">Resources</a>
        <a class="nav-link" href="highlights.html">Highlights</a>
      </nav>

      <div class="hero-title-row">
        <div class="hero-avatar">
          <img src="assets/img/avatar.jpg" alt="Group avatar" />
        </div>
        <div class="hero-title">
          <h1>Montgomery Group</h1>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="section">
      <h2 class="section-title">Resources</h2>
      <div class="divider"></div>

      <div id="resError" class="error-box" style="display:none;"></div>
      <div id="resList" class="resources-list"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-row">
        <div class="footer-copy">&copy; 2026 Montgomery Group</div>
        <div class="footer-links">
          <a href="privacy.html">Privacy Policy</a>
        </div>
      </div>
    </div>
  </footer>

  <script>
    function showError(msg){
      const el = document.getElementById("resError");
      el.style.display = "block";
      el.textContent = msg;
    }

    function safeText(v){
      return (v ?? "").toString().trim();
    }

    function escapeHtml(str){
      return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    async function loadResources(){
      const list = document.getElementById("resList");
      list.innerHTML = "";

      try{
        const res = await fetch("assets/data/resources.json", { cache: "no-store" });
        if(!res.ok) throw new Error("resources.json read failed: " + res.status);

        const items = await res.json();

        if(!Array.isArray(items) || items.length === 0){
          list.innerHTML = "<div class='muted' style='text-align:center;'>No resources yet.</div>";
          return;
        }

        items.forEach(r => {
          const title = safeText(r.title || r.name || r.resource_title);
          const url = safeText(r.url || r.link);
          const desc = safeText(r.description || r.note || r.short_note);

          if(!title && !url) return;

          const row = document.createElement("div");
          row.className = "resource-item";

          let titleHtml = "";
          if(url){
            titleHtml = `<h3 class="resource-title"><a href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(title || url)}</a></h3>`;
          }else{
            titleHtml = `<h3 class="resource-title">${escapeHtml(title)}</h3>`;
          }

          let descHtml = "";
          if(desc){
            descHtml = `<p class="resource-desc">${escapeHtml(desc)}</p>`;
          }

          row.innerHTML = titleHtml + descHtml;
          list.appendChild(row);
        });

        if(!list.children.length){
          list.innerHTML = "<div class='muted' style='text-align:center;'>No resources yet.</div>";
        }

      }catch(e){
        showError("Failed to load the Resources page: " + e.message);
      }
    }

    loadResources();
  </script>

</body>
</html>
