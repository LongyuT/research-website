<!DOCTYPE html>
<html lang="en">
<!-- Head: page metadata, title, favicon, and stylesheet links. -->
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Montgomery Group - Projects</title>
  <meta name="description" content="Montgomery Group — Projects." />

  <link rel="icon" type="image/x-icon" href="https://www.owlstown.com/favicon.ico" />
  <link rel="stylesheet" href="assets/css/style.css" />

  <!-- Page-specific CSS for project list error messages. -->
<style>
    .error-box{
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff7f7;
      color: #8a1f1f;
      margin-bottom: 14px;
    }
  </style>
</head>

<!-- Body: visible page content starts here. -->
<body>

  <!-- Hero header: shared banner, navigation bar, and group title. -->
<header class="hero">
    <div class="hero-bg" style="background-image:url('assets/img/banner.jpg');"></div>
    <div class="hero-overlay"></div>

    <div class="hero-inner">
      <!-- Navigation links: lets visitors move between the main website pages. -->
<nav class="nav">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="publications.html">Publications</a>
        <a class="nav-link" href="people.html">People</a>
        <a class="nav-link active" href="projects.html">Projects</a>
        <a class="nav-link" href="resources.html">Resources</a>
        <a class="nav-link" href="highlights.html">Highlights</a>
      </nav>

      <div class="hero-title-row">
        <div class="hero-avatar">
          <img src="assets/img/avatar.jpg" alt="Group avatar" />
        </div>
        <div class="hero-title">
          <h1>Montgomery Group</h1>
        </div>
      </div>
    </div>
  </header>

  <!-- Main content area: holds the unique content for this page. -->
<main class="container">
    <!-- Projects section: JavaScript loads project cards from projects.json. -->
<section class="section">
      <h2 class="section-title">Projects</h2>
      <div class="divider"></div>

      <div id="projError" class="error-box" style="display:none;"></div>
      <div id="projList" class="project-list"></div>
    </section>
  </main>

  <!-- Footer: copyright and privacy link shared across the site. -->
<footer class="footer">
    <div class="container footer-inner">
      <div class="footer-row">
        <div class="footer-copy">&copy; 2026 Montgomery Group</div>
        <div class="footer-links">
          <a href="privacy.html">Privacy Policy</a>
        </div>
      </div>
    </div>
  </footer>

  <!-- Page-specific JavaScript for loading projects and image preview lightbox. -->
<script>
    // Show an error message on the page if JSON loading fails.
    function showError(msg){
      const el = document.getElementById("projError");
      el.style.display = "block";
      el.textContent = msg;
    }

    // Convert missing values into safe strings before displaying them.
    function safeText(s){
      return (s ?? "").toString();
    }

    // Load projects from JSON and display each project as a card.
    async function loadProjects(){
      const list = document.getElementById("projList");
      list.innerHTML = "";

      try{
        // Fetch the related JSON data without using browser cache.
        const res = await fetch("assets/data/projects.json", { cache: "no-store" });
        if(!res.ok) throw new Error("projects.json read failed: " + res.status);

        const projects = await res.json();
        if(!Array.isArray(projects) || projects.length === 0){
          showError("No project data found. assets/data/projects.json is empty or incorrectly formatted.");
          return;
        }

        // ===== Lightbox =====
        // Create one reusable lightbox for previewing project images.
        const lb = document.createElement("div");
        lb.className = "lightbox";
        lb.innerHTML = `
          <div class="lightbox-inner" role="dialog" aria-modal="true" aria-label="Image preview">
            <button class="lightbox-close" aria-label="Close">✕</button>
            <img class="lightbox-img" alt="Project image"/>
          </div>
        `;
        document.body.appendChild(lb);

        const lbImg = lb.querySelector(".lightbox-img");
        const lbClose = lb.querySelector(".lightbox-close");

        // Open the image preview and prevent the page behind it from scrolling.
        function openLightbox(src, alt){
          lbImg.src = src;
          lbImg.alt = alt || "Project image";
          lb.classList.add("is-open");
          document.body.style.overflow = "hidden";
        }

        // Close the image preview and restore normal page scrolling.
        function closeLightbox(){
          lb.classList.remove("is-open");
          lbImg.src = "";
          document.body.style.overflow = "";
        }

        lb.addEventListener("click", function(e){
          if(e.target === lb) closeLightbox();
        });
        lbClose.addEventListener("click", closeLightbox);
        window.addEventListener("keydown", function(e){
          if(e.key === "Escape") closeLightbox();
        });

        // Create one HTML card for each project.
        projects.forEach(p => {
          const id = safeText(p.id).trim();
          if(!id) return;

          const title = safeText(p.title) || "Untitled";
          const desc  = safeText(p.summary) || "";
          const img   = safeText(p.image).trim();

          const row = document.createElement("div");
          row.className = "project-item";

          const link = p.external_url
            ? `<a href="${p.external_url}" target="_blank" rel="noopener">${title}</a>`
            : `<a href="project.html?id=${encodeURIComponent(id)}">${title}</a>`;

          let imageHtml = "";
          if(img){
            imageHtml = `
              <div class="project-img">
                <button type="button" class="project-img-btn" aria-label="Open image preview">
                  <img src="${img}" alt="${title}" loading="lazy">
                </button>
              </div>
            `;
          }

          row.innerHTML = `
            ${imageHtml}
            <div class="project-text">
              <h3 class="project-title">${link}</h3>
              <p class="project-desc">${desc}</p>
            </div>
          `;

          list.appendChild(row);

          const btn = row.querySelector(".project-img-btn");
          if(btn){
            btn.addEventListener("click", function(){
              openLightbox(img, title);
            });
          }
        });

      }catch(e){
        showError("Projects page failed to load: " + e.message);
      }
    }

    loadProjects();
  </script>

</body>
</html>
