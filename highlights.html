<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Montgomery Group - Highlights</title>
  <meta name="description" content="Montgomery Group — Highlights." />

  <link rel="icon" type="image/x-icon" href="https://www.owlstown.com/favicon.ico" />
  <link rel="stylesheet" href="assets/css/style.css" />

  <style>
    .error-box{
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff7f7;
      color: #8a1f1f;
      margin-bottom: 14px;
    }

    .highlights-list{
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin-top: 6px;
    }

    .highlight-item{
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 18px;
      align-items: start;
      background: var(--panel-2);
      border-radius: 18px;
      padding: 18px;
    }

    .highlight-img{
      width: 180px;
      height: 120px;
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
      border: 1px solid #d7dbe2;
      box-shadow: var(--shadow-soft);
    }

    .highlight-img img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .highlight-date{
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .highlight-title{
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.4;
    }

    .highlight-title a{
      color: var(--link);
      text-decoration: underline;
    }

    .highlight-summary,
    .highlight-description{
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.75;
    }

    @media (max-width: 760px){
      .highlight-item{
        grid-template-columns: 1fr;
      }

      .highlight-img{
        width: 100%;
        max-width: 320px;
        height: 200px;
      }
    }
  </style>
</head>

<body>

  <header class="hero">
    <div class="hero-bg" style="background-image:url('assets/img/banner.jpg');"></div>
    <div class="hero-overlay"></div>

    <div class="hero-inner">
      <nav class="nav">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="publications.html">Publications</a>
        <a class="nav-link" href="people.html">People</a>
        <a class="nav-link" href="projects.html">Projects</a>
        <a class="nav-link" href="resources.html">Resources</a>
        <a class="nav-link active" href="highlights.html">Highlights</a>
      </nav>

      <div class="hero-title-row">
        <div class="hero-avatar">
          <img src="assets/img/avatar.jpg" alt="Group avatar" />
        </div>
        <div class="hero-title">
          <h1>Montgomery Group</h1>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="section">
      <h2 class="section-title">Highlights</h2>
      <div class="divider"></div>

      <div id="hlError" class="error-box" style="display:none;"></div>
      <div id="hlList" class="highlights-list"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-row">
        <div class="footer-copy">&copy; 2026 Montgomery Group</div>
        <div class="footer-links">
          <a href="privacy.html">Privacy Policy</a>
        </div>
      </div>
    </div>
  </footer>

  <script>
    function showError(msg){
      const el = document.getElementById("hlError");
      el.style.display = "block";
      el.textContent = msg;
    }

    function safeText(v){
      return (v ?? "").toString().trim();
    }

    function escapeHtml(str){
      return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    async function loadHighlights(){
      const list = document.getElementById("hlList");
      list.innerHTML = "";

      try{
        const res = await fetch("assets/data/highlights.json", { cache: "no-store" });
        if(!res.ok) throw new Error("highlights.json read failed: " + res.status);

        const items = await res.json();

        if(!Array.isArray(items) || items.length === 0){
          list.innerHTML = "<div class='muted' style='text-align:center;'>No highlights yet.</div>";
          return;
        }

        items.sort((a,b) => {
          const da = safeText(a.date);
          const db = safeText(b.date);
          if(!da && !db) return 0;
          if(!da) return 1;
          if(!db) return -1;
          return db.localeCompare(da);
        });

        items.forEach(h => {
          const title = safeText(h.title);
          const text = safeText(h.text);
          const date = safeText(h.date);
          const summary = safeText(h.summary);
          const description = safeText(h.description);
          const link = safeText(h.link);
          const image = safeText(h.image);

          const displayTitle = title || text;
          if(!displayTitle && !summary && !description) return;

          const row = document.createElement("div");
          row.className = "highlight-item";

          let imageHtml = "";
          if(image){
            imageHtml = `
              <div class="highlight-img">
                <img src="${escapeHtml(image)}" alt="${escapeHtml(displayTitle || "Highlight image")}" loading="lazy" />
              </div>
            `;
          }

          let dateHtml = "";
          if(date){
            dateHtml = `<p class="highlight-date">${escapeHtml(date)}</p>`;
          }

          let titleHtml = "";
          if(displayTitle){
            if(link){
              titleHtml = `<h3 class="highlight-title"><a href="${escapeHtml(link)}" target="_blank" rel="noopener">${escapeHtml(displayTitle)}</a></h3>`;
            }else{
              titleHtml = `<h3 class="highlight-title">${escapeHtml(displayTitle)}</h3>`;
            }
          }

          let summaryHtml = "";
          if(summary){
            summaryHtml = `<p class="highlight-summary">${escapeHtml(summary)}</p>`;
          } else if(text && !title){
            summaryHtml = `<p class="highlight-summary">${escapeHtml(text)}</p>`;
          }

          let descriptionHtml = "";
          if(description){
            descriptionHtml = `<p class="highlight-description" style="margin-top:8px;">${escapeHtml(description)}</p>`;
          }

          row.innerHTML = `
            ${imageHtml}
            <div>
              ${dateHtml}
              ${titleHtml}
              ${summaryHtml}
              ${descriptionHtml}
            </div>
          `;

          list.appendChild(row);
        });

        if(!list.children.length){
          list.innerHTML = "<div class='muted' style='text-align:center;'>No highlights yet.</div>";
        }

      }catch(e){
        showError("Failed to load the Highlights page: " + e.message);
      }
    }

    loadHighlights();
  </script>

</body>
</html>
