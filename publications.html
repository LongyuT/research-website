<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Publication - Montgomery Group</title>
  <link rel="icon" type="image/x-icon" href="https://www.owlstown.com/favicon.ico" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>
  <!-- Header / Hero（沿用你现有的 hero 风格） -->
  <header class="hero">
    <div class="hero-bg" style="background-image:url('assets/img/banner.jpg');"></div>
    <div class="hero-overlay"></div>

    <div class="hero-inner">
      <nav class="nav">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link active" href="publications.html">Publications</a>
        <a class="nav-link" href="people.html">People</a>
        <a class="nav-link" href="projects.html">Projects</a>
        <a class="nav-link" href="highlights.html">Highlights</a>
      </nav>

      <div class="hero-title-row">
        <div class="hero-avatar">
          <img src="assets/img/avatar.jpg" alt="Group avatar" />
        </div>
        <div class="hero-title">
          <h1>Montgomery Group</h1>
        </div>
      </div>
    </div>
  </header>

  <main class="container section">
    <a href="publications.html" class="pub-backlink">← Back to Publications</a>

    <h2 id="pub-title" class="pub-detail-title">Loading...</h2>

    <div class="pub-detail-meta">
      <div id="pub-type" class="pub-detail-type"></div>
      <div id="pub-authors" class="pub-detail-authors"></div>
      <div id="pub-venue" class="pub-detail-venue"></div>
    </div>

    <div id="pub-buttons" class="pub-detail-buttons"></div>

    <h3 class="pub-detail-section-title">Abstract</h3>
    <div id="pub-abstract" class="pub-detail-abstract">—</div>

    <div id="pub-cite" class="pub-detail-cite"></div>
  </main>

  <script src="assets/js/publication.js"></script>
</body>
</html>
