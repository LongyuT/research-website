<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Publications | Montgomery Group</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>

<header class="hero">
  <div class="hero-bg" style="background-image:url('assets/img/banner.jpg');"></div>
  <div class="hero-overlay"></div>

  <div class="hero-inner">
    <nav class="nav">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link active" href="publications.html">Publications</a>
      <a class="nav-link" href="people.html">People</a>
      <a class="nav-link" href="projects.html">Projects</a>
      <a class="nav-link" href="highlights.html">Highlights</a>
    </nav>

    <div class="hero-title-row">
      <div class="hero-avatar">
        <img src="assets/img/avatar.jpg" />
      </div>
      <div class="hero-title">
        <h1>Montgomery Group</h1>
      </div>
    </div>
  </div>
</header>

<main class="container">
  <section class="section">
    <h2 class="section-title">Publications</h2>
    <div class="divider"></div>
    <div id="pubs-root"></div>
  </section>
</main>

<script src="assets/js/publications-data.js"></script>

<script>
(function(){
  var root = document.getElementById("pubs-root");
  var pubs = (window.PUBLICATIONS || []).slice();

  pubs.sort(function(a,b){
    return (b.year||0) - (a.year||0);
  });

  var imageMap = {
    "n-oxide-insertion-lda-2025": "assets/img/pub1.png",
    "diastereoselective-3-2-2024": "assets/img/pub2.png",
    "3-2-cycloadditions-2023": "assets/img/pub3.png",
    "aza-bodipys-2022": "assets/img/pub4.png",
    "nitrated-aza-bodipys-2022": "assets/img/pub5.png"
  };

  pubs.forEach(function(p){

    var item = document.createElement("article");
    item.className = "pub-item";

    var link = "publication.html?slug=" + encodeURIComponent(p.slug);

    if(imageMap[p.slug]){
      var thumb = document.createElement("div");
      thumb.className = "pub-thumb";

      var aImg = document.createElement("a");
      aImg.href = link;

      var img = document.createElement("img");
      img.src = imageMap[p.slug];
      img.alt = p.title;

      aImg.appendChild(img);
      thumb.appendChild(aImg);
      item.appendChild(thumb);
    }

    var content = document.createElement("div");
    content.className = "pub-content";

    var title = document.createElement("h3");
    title.className = "pub-title";

    var a = document.createElement("a");
    a.href = link;
    a.textContent = p.title;

    title.appendChild(a);

    var authors = document.createElement("p");
    authors.className = "pub-authors";
    authors.textContent = p.authors || "";

    var venue = document.createElement("p");
    venue.className = "pub-venue";
    venue.textContent = p.venue || "";

    content.appendChild(title);
    content.appendChild(authors);
    content.appendChild(venue);

    item.appendChild(content);
    root.appendChild(item);
  });
})();
</script>

</body>
</html>
