<!DOCTYPE html>
<html lang="en">
<!-- Head: page metadata, title, favicon, and stylesheet links. -->
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Publications | Montgomery Group</title>
  <meta name="description" content="Montgomery Group Publications." />

  <link rel="icon" type="image/x-icon" href="https://www.owlstown.com/favicon.ico" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>

<!-- Body: visible page content starts here. -->
<body>

  <!-- Hero header: shared banner, navigation bar, and group title. -->
<header class="hero">
    <div class="hero-bg" style="background-image:url('assets/img/banner.jpg');"></div>
    <div class="hero-overlay"></div>

    <div class="hero-inner">
      <!-- Navigation links: lets visitors move between the main website pages. -->
<nav class="nav">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link active" href="publications.html">Publications</a>
        <a class="nav-link" href="people.html">People</a>
        <a class="nav-link" href="projects.html">Projects</a>
        <a class="nav-link" href="resources.html">Resources</a>
        <a class="nav-link" href="highlights.html">Highlights</a>
      </nav>

      <div class="hero-title-row">
        <div class="hero-avatar">
          <img src="assets/img/avatar.jpg" alt="Group avatar" />
        </div>
        <div class="hero-title">
          <h1>Montgomery Group</h1>
        </div>
      </div>
    </div>
  </header>

  <!-- Main content area: holds the unique content for this page. -->
<main class="container">
    <!-- Publications section: JavaScript loads all publications and groups them by year. -->
<section class="section">
      <h2 class="section-title">Publications</h2>
      <div class="divider"></div>

      <div id="pubs-root"></div>
    </section>
  </main>

  <!-- Footer: copyright and privacy link shared across the site. -->
<footer class="footer">
    <div class="container footer-inner">
      <div class="footer-row">
        <div class="footer-copy">&copy; 2026 Montgomery Group</div>
        <div class="footer-links">
          <a href="privacy.html">Privacy Policy</a>
        </div>
      </div>
    </div>
  </footer>

  <!-- Page-specific JavaScript for loading publications and image preview lightbox. -->
<script>
    // Immediately run this function when the publications page loads.
    (async function(){
      var root = document.getElementById("pubs-root");

      try{
        // Fetch the related JSON data without using browser cache.
        const res = await fetch("assets/data/publications.json", { cache: "no-store" });
        if(!res.ok) throw new Error("publications.json read failed: " + res.status);

        var pubs = await res.json();
        pubs = Array.isArray(pubs) ? pubs.slice() : [];

        pubs.sort(function(a,b){
          return (b.year||0) - (a.year||0);
        });

        var groups = {};
        pubs.forEach(function(p){
          var y = p.year || "Other";
          if(!groups[y]) groups[y] = [];
          groups[y].push(p);
        });

        var years = Object.keys(groups).sort(function(a,b){
          if(a === "Other") return 1;
          if(b === "Other") return -1;
          return Number(b) - Number(a);
        });

        var lb = document.createElement("div");
        lb.className = "lightbox";
        lb.innerHTML = `
          <div class="lightbox-inner" role="dialog" aria-modal="true" aria-label="Image preview">
            <button class="lightbox-close" aria-label="Close">✕</button>
            <img class="lightbox-img" alt="Publication figure"/>
          </div>
        `;
        document.body.appendChild(lb);

        var lbImg = lb.querySelector(".lightbox-img");
        var lbClose = lb.querySelector(".lightbox-close");

        // Open the image preview and prevent the page behind it from scrolling.
        function openLightbox(src, alt){
          lbImg.src = src;
          lbImg.alt = alt || "Publication figure";
          lb.classList.add("is-open");
          document.body.style.overflow = "hidden";
        }

        // Close the image preview and restore normal page scrolling.
        function closeLightbox(){
          lb.classList.remove("is-open");
          lbImg.src = "";
          document.body.style.overflow = "";
        }

        lb.addEventListener("click", function(e){
          if(e.target === lb) closeLightbox();
        });
        lbClose.addEventListener("click", closeLightbox);
        window.addEventListener("keydown", function(e){
          if(e.key === "Escape") closeLightbox();
        });

        years.forEach(function(y){
          var h3 = document.createElement("div");
          h3.className = "pub-year-title";
          h3.textContent = y;
          root.appendChild(h3);

          var list = document.createElement("div");
          list.className = "pub-list";
          root.appendChild(list);

          groups[y].forEach(function(p){
            var item = document.createElement("article");
            item.className = "pub-item";

            var link = "publication.html?slug=" + encodeURIComponent(p.slug);

            if(p.image){
              var thumbWrap = document.createElement("div");
              thumbWrap.className = "pub-thumb";

              var btn = document.createElement("button");
              btn.type = "button";
              btn.style.all = "unset";
              btn.style.display = "block";
              btn.style.cursor = "zoom-in";

              var img = document.createElement("img");
              img.src = p.image;
              img.alt = "TOC graphic";
              img.loading = "lazy";

              btn.addEventListener("click", function(){
                openLightbox(p.image, p.title);
              });

              btn.appendChild(img);
              thumbWrap.appendChild(btn);
              item.appendChild(thumbWrap);
            }

            var content = document.createElement("div");
            content.className = "pub-content";

            var title = document.createElement("h3");
            title.className = "pub-title";

            var a = document.createElement("a");
            a.href = link;
            a.textContent = p.title || "(Untitled)";
            title.appendChild(a);

            var authors = document.createElement("p");
            authors.className = "pub-authors";
            authors.textContent = p.authors || "";

            var venue = document.createElement("p");
            venue.className = "pub-venue";
            venue.textContent = p.venue || "";

            content.appendChild(title);
            content.appendChild(authors);
            content.appendChild(venue);

            item.appendChild(content);
            list.appendChild(item);
          });
        });

      }catch(e){
        root.innerHTML = "<p>Failed to load publications: " + e.message + "</p>";
      }
    })();
  </script>
</body>
</html>
