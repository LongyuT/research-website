<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Publication | Montgomery Group</title>
  <meta name="description" content="Publication detail page." />

  <link rel="icon" type="image/x-icon" href="https://www.owlstown.com/favicon.ico" />
  <link rel="stylesheet" href="assets/css/style.css" />

  <style>
    .pub-detail-image-wrap{
      margin: 18px 0 22px;
      display: none;
    }

    .pub-detail-image{
      max-width: 100%;
      width: auto;
      height: auto;
      display: block;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      padding: 8px;
      box-shadow: 0 8px 20px rgba(0,0,0,.06);
    }
  </style>
</head>

<body>

  <header class="hero">
    <div class="hero-bg" style="background-image:url('assets/img/banner.jpg');"></div>
    <div class="hero-overlay"></div>

    <div class="hero-inner">
      <nav class="nav">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link active" href="publications.html">Publications</a>
        <a class="nav-link" href="people.html">People</a>
        <a class="nav-link" href="projects.html">Projects</a>
        <a class="nav-link" href="resources.html">Resources</a>
        <a class="nav-link" href="highlights.html">Highlights</a>
      </nav>

      <div class="hero-title-row">
        <div class="hero-avatar">
          <img src="assets/img/avatar.jpg" alt="Group avatar" />
        </div>
        <div class="hero-title">
          <h1>Montgomery Group</h1>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="section">
      <h2 id="pub-title" class="pub-detail-title">Loading...</h2>
      <p id="pub-type" class="muted"></p>
      <p id="pub-authors" class="pub-authors"></p>
      <p id="pub-venue" class="pub-venue"></p>

      <div id="pub-buttons" class="pub-buttons"></div>

      <div id="pub-image-wrap" class="pub-detail-image-wrap">
        <img id="pub-image" class="pub-detail-image" src="" alt="Publication figure" />
      </div>

      <h3 class="pub-subhead">Abstract</h3>
      <div id="pub-abstract" class="content"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-row">
        <div class="footer-copy">&copy; 2026 Montgomery Group</div>
        <div class="footer-links">
          <a href="privacy.html">Privacy Policy</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="assets/js/publication-page.js"></script>
</body>
</html>
